schemaVersion: 1
network:
  buses: [musical-input, sostenuto-output]
  modules:
    - name: M-IN
      type: midi-message-filter
      sources:
        - hammer-main
        - hammer-midi-2
        - hammer-midi-3
        - hammer-midi-4
        - motu
        - launchpad-main
        - launchpad-midi-2
        - launchpad-midi-3
      destinations: [musical-input]
      settings:
        whitelist:
          - type: NOTE
          - type: CC
          - type: P_BEND
          - type: CH_PR
          - type: POLY_AT
          - type: PC
    - name: MON
      type: midi-monitor
      sources: [musical-input]
      settings:
        historyLimit: 2000
        colors: true
    - name: SOS
      type: sostenuto
      sources: [musical-input]
      destinations: [sostenuto-output, postSSB]
      settings:
        controlOrigins: [launchpad-main]
        trigger:
          note: 78
          toggle: true
          invert: false
        activationThreshold: 10
        hysteresis: 2
        umbrella:
          enabled: true
          delayMs: 1
          tailMs: 1
    - name: CHRD
      type: midi-chord
      sources: [sostenuto-output]
      settings: {maxChords: 6}
    - name: EMT
      type: midi-emitter
      destinations: [postSSB]
      settings:
        format: hex
        messages: []
