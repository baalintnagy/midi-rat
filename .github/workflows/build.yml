name: Verify, Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Match the Visual Studio 2026 generator/toolset in build-native.ps1.
    runs-on: windows-2025-vs2026
    outputs:
      has-build: ${{ steps.detect.outputs.has-build }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate specification and shared configuration
        shell: pwsh
        run: ./scripts/validate-specification.ps1

      - name: Detect application build
        id: detect
        shell: pwsh
        env:
          IS_VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $hasBuild = Test-Path -LiteralPath pom.xml -PathType Leaf
          "has-build=$($hasBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $hasBuild) {
              'Documentation/configuration checks only: no Java application build exists.' >> $env:GITHUB_STEP_SUMMARY
              if ($env:IS_VERSION_TAG -eq 'true') {
                  throw 'Cannot release an application without its build descriptor and packaged artifacts.'
              }
          }

      - name: Set up JDK 25
        if: steps.detect.outputs.has-build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify Java style, tests and package
        if: steps.detect.outputs.has-build == 'true'
        shell: pwsh
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate and archive app image
        if: steps.detect.outputs.has-build == 'true'
        shell: pwsh
        run: |
          $appImage = Join-Path $PWD 'target/jpackage-out/MidiRat'
          if (-not (Test-Path -LiteralPath (Join-Path $appImage 'MidiRat.exe') -PathType Leaf)) {
              throw 'Build did not produce the Windows console launcher.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $appImage 'runtime/bin/java.dll') -PathType Leaf)) {
              throw 'Build did not produce a bundled Java runtime.'
          }
          Compress-Archive -Path (Join-Path $appImage '*') -DestinationPath target/MidiRat-windows.zip -Force

      - name: Upload Windows distribution
        if: steps.detect.outputs.has-build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: midi-rat-windows
          path: target/MidiRat-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.has-build == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: midi-rat-windows
          path: release

      - name: Publish verified tag artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" release/MidiRat-windows.zip --verify-tag --generate-notes --title "$env:RELEASE_TAG"
